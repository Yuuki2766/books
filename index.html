<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍マネージャー</title>
    
    <link rel="stylesheet" href="style.css?v=2.0.3">
    <script src="script.js?v=2.0.4" defer></script>
    
    <style>
        /* 詳細画面が表示されているときは、検索ボタンを隠す */
        /* 詳細画面が表示されている時はボタンを隠す */
        #detail-view[style*="display: block"] ~ #btn-trigger-search {
            display: none !important;
        }

        /* 手動開閉用のヘッダースタイル */
        #main-header {
            position: sticky;
            top: 0;
            z-index: 100;
            transition: transform 0.3s ease, opacity 0.3s ease;
            transform: translateY(0);
            opacity: 1;
        }
        #main-header.panel-hide {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        /* 検索を開くための浮遊ボタン */
        #btn-trigger-search {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 999;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.2s;
        }
        #btn-trigger-search:hover {
            background: #4338ca;
            transform: scale(1.05);
        }

        .header-toggle-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            height: 32px;
            box-sizing: border-box;
        }
        .header-toggle-btn:hover {
            background: #475569;
        }

        .card-content {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 8px;
        }
        .fav-star-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
        }
        .edit-controls-right {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-left: auto;
            padding-left: 8px;
        }
        .order-btn {
            background: #4b5563;
            color: white;
            border: none;
            border-radius: 4px;
            width: 32px;
            height: 32px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vol-btn {
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 4px;
            width: 28px;
            height: 28px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .edit-form-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .edit-form-container label {
            font-size: 13px;
            font-weight: bold;
            color: #334155;
        }
        .edit-form-container input, .edit-form-container textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .edit-form-btns {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        /* メインモード切り替えタブのスタイル（4種類並ぶため最大幅を550pxに拡張） */
        .mode-tab-container {
            display: flex;
            background: #1e293b;
            padding: 3px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid #334155;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
            gap: 2px;
        }
        .mode-tab-btn {
            flex: 1;
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 8px 4px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }
        .mode-tab-btn.active-all {
            background: #6366f1; /* ✨ 全作品（インディゴ） */
            color: white;
        }

        .mode-tab-btn.active-normal {
            background: #4f46e5;
            color: white;
        }
        .mode-tab-btn.active-syosetu {
            background: #0284c7;
            color: white;
        }
        .mode-tab-btn.active-web {
            background: #16a34a;
            color: white;
        }
        .mode-tab-btn.active-r18 {
            background: #e11d48;
            color: white;
        }

        /* 見出し（タイトル）サイズを少し抑える微調整 */
        .book-title {
            font-size: 15px !important;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 2px;
        }
        .mini-title {
            font-size: 11.5px !important;
        }
        .compact-filters {
            display: flex;
            flex-wrap: wrap; /* 画面幅が狭い場合は自動で折り返します */
            gap: 6px;
            margin-bottom: 10px;
        }

        .filter-btn {
            background: #e2e8f0;
            color: #475569;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            transition: all 0.2s;
            font-weight: bold;
        }

        .filter-btn input {
            display: none; /* 元のチェックボックスを隠す */
        }

        /* チェックされた時の色 */
        .filter-btn:has(input:checked) {
            background: #4f46e5;
            color: white;
        }

        /* ホバー時の反応 */
        .filter-btn:hover {
            background: #cbd5e1;
        }
        .filter-btn:has(input:checked):hover {
            background: #4338ca;
        }



    </style>
</head>
<body>

<button id="btn-trigger-search" onclick="toggleHeaderPanel()" style="display: none;">
    🔍 検索・フィルタを開く
</button>

<header id="main-header">
    <div class="header-topline">
        <h1>📚 書籍マネージャー</h1>
        <div class="header-actions">
            <button id="logout-btn" onclick="logoutR18()" style="display:none;">ログアウト</button>
            <button class="header-toggle-btn" onclick="toggleHeaderPanel()" aria-label="検索欄を隠す">▲</button>
        </div>
    </div>

    <div class="mode-tab-container" id="mode-tabs" aria-label="本の種類">
        <button class="mode-tab-btn active-all" id="tab-mode-all" onclick="switchContentMode('all')">🌐 全件</button>
        <button class="mode-tab-btn" id="tab-mode-normal" onclick="switchContentMode('normal')">📗 通常</button>
        <button class="mode-tab-btn" id="tab-mode-syosetu" onclick="switchContentMode('syosetu')">📘 小説</button>
        <button class="mode-tab-btn" id="tab-mode-web" onclick="switchContentMode('web')">📙 Web</button>
        <button class="mode-tab-btn" id="tab-mode-r18" onclick="switchContentMode('r18')" style="display:none;">🔞 R18</button>
    </div>

    <div class="search-toolbar">
        <div class="search-box-wrap">
            <span aria-hidden="true">🔎</span>
            <input type="search" id="search" placeholder="タイトル・作者・出版社・ジャンルで検索" autocomplete="off">
            <button id="clear-search" type="button" onclick="clearSearchKeyword()" aria-label="検索語を消す">×</button>
        </div>
        <button id="advanced-toggle" class="advanced-toggle" type="button" onclick="toggleAdvancedFilters()" aria-expanded="false" aria-controls="advanced-filters">詳細検索 <span>⌄</span></button>
    </div>

    <div id="active-filter-chips" class="active-filter-chips" aria-live="polite"></div>

    <section id="advanced-filters" class="advanced-filters" hidden>
        <div class="filter-grid">
            <fieldset>
                <legend>出版社 <span class="legend-note">複数選択可</span></legend>
                <div id="publisher-options" class="checkbox-options"></div>
            </fieldset>
            <fieldset>
                <legend>ジャンル <span class="legend-note">複数選択可</span></legend>
                <div class="logic-switch" role="group" aria-label="ジャンル条件">
                    <button type="button" class="active" data-genre-logic="or">いずれか</button>
                    <button type="button" data-genre-logic="and">すべて</button>
                </div>
                <div id="genre-options" class="checkbox-options"></div>
            </fieldset>
            <fieldset>
                <legend>除外する作品</legend>
                <div class="checkbox-options compact">
                    <label><input type="checkbox" id="exclude-depress">鬱</label>
                    <label><input type="checkbox" id="exclude-short">短編・読切</label>
                    <label><input type="checkbox" id="exclude-unfinished">未完・未完結</label>
                </div>
            </fieldset>
            <fieldset>
                <legend>読書状態</legend>
                <div class="segmented" id="read-status-filter" role="group" aria-label="読書状態">
                    <button type="button" class="active" data-status="all">すべて</button>
                    <button type="button" data-status="unread">未読</button>
                    <button type="button" data-status="reading">読書中</button>
                    <button type="button" data-status="finished">読了</button>
                </div>
            </fieldset>
            <fieldset>
                <legend>その他</legend>
                <div class="checkbox-options compact">
                    <label><input type="checkbox" id="favorite-only">お気に入りのみ</label>
                    <label><input type="checkbox" id="pdf-only">本文あり</label>
                    <label><input type="checkbox" id="info-only">作品URLあり</label>
                    <label><input type="checkbox" id="complete-only">全巻所持</label>
                    <label><input type="checkbox" id="search-summary">あらすじも検索</label>
                </div>
            </fieldset>
            <fieldset>
                <legend>並び替え</legend>
                <select id="sortFilter">
                    <option value="default">標準</option>
                    <option value="title">作品名順</option>
                    <option value="author">作者順</option>
                    <option value="favorite">お気に入り順</option>
                    <option value="progress">収集率が高い順</option>
                    <option value="progress-asc">収集率が低い順</option>
                    <option value="volumes">巻数が多い順</option>
                </select>
            </fieldset>
        </div>
        <div class="advanced-footer">
            <button type="button" class="reset-filter-btn" onclick="resetAdvancedFilters()">条件をリセット</button>
            <div class="view-mode-btns">
                <button onclick="changeMainView('list')" id="btn-list-view" class="active">一覧</button>
                <button onclick="changeMainView('slide')" id="btn-slide-view">スライド</button>
            </div>
            <label id="edit-mode-label"><input type="checkbox" id="editModeToggle" onchange="toggleEditModeUi()"> 🛠️ 編集</label>
        </div>
        <div class="admin-link-row"><a href="#admin" id="link-admin-view">⚙️ 新規書籍の追加・エクスポート</a></div>
    </section>
</header>

<main>
    <div id="list-view">
        <div id="summary"></div>
        <div id="book-list"></div>
    </div>

    <div id="slide-view" style="display: none;">
        <div id="genre-rows-container"></div>
    </div>

    <div id="detail-view" style="display: none;">
        <button class="back-btn" onclick="goBack()">← 一覧に戻る</button>
        <div id="detail-content"></div>
    </div>

    <div id="admin-view" style="display: none; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 10px; color: #222;">
        <button class="back-btn" onclick="goBack()">← マネージャーに戻る</button>
        
        <h2 style="margin-top: 10px; font-size: 20px; border-bottom: 2px solid #4f46e5; padding-bottom: 8px;">⚙️ ローカルデータ管理・エクスポート</h2>
        
        <div style="background: #eef2ff; border: 1px solid #c7d2fe; padding: 15px; border-radius: 8px; margin-bottom: 25px; font-size: 14px;">
            <h3 style="margin: 0 0 10px 0; font-size: 15px; color: #4f46e5;">📋 GitHubへの反映手順</h3>
            <p style="margin: 0 0 12px 0; color: #374151; line-height: 1.4;">
                ここで追加・並び替えた最新データをGitHubに保存します。<br>
                下のボタンを押して、最新の JSON ファイルを直接ダウンロードするか、クリップボードにコピーしてください。
            </p>
            <button type="button" onclick="downloadJsonFile()" style="padding: 10px 16px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                📥 最新の JSON をダウンロードする
            </button>
            <button type="button" onclick="copyJsonToClipboard()" style="padding: 10px 16px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 10px;">
                📋 テキストとして一発コピーする
            </button>
            <button type="button" onclick="clearLocalChanges()" style="padding: 10px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left:10px;">
                ⚠️ ローカルの変更をリセット
            </button>
        </div>

        <h3 style="font-size: 16px; margin-bottom: 12px; color: #1e293b;">📝 新しい作品の追加</h3>
        <form id="add-book-form" style="display: flex; flex-direction: column; gap: 12px; max-width: 500px;">
            <div>
                <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">タイトル *</label>
                <input type="text" id="new-title" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">作者</label>
                    <input type="text" id="new-author" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
                </div>
                <div style="flex: 1;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">イラストレーター</label>
                    <input type="text" id="new-illustrator" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">レーベル・出版社</label>
                    <input type="text" id="new-publisher" placeholder="例: カクヨム, 新潮社, 集英社" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
                </div>
                <div style="flex: 1;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">ジャンル (スラッシュ区切り)</label>
                    <input type="text" id="new-genre" placeholder="例: 推理/小説" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">既刊・所持巻数 (カンマ区切り)</label>
                    <input type="text" id="new-owned" placeholder="例: 1, 2, 3" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
                </div>
                <div style="flex: 1;">
                    <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">総巻数</label>
                    <input type="number" id="new-total" value="1" min="1" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
                </div>
            </div>
            <div>
                <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">画像ファイルパス</label>
                <input type="text" id="new-image" placeholder="例: images/cover.jpg" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">あらすじ</label>
                <textarea id="new-summary" rows="3" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; font-family:sans-serif; box-sizing: border-box;"></textarea>
            </div>
            <div>
                <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">PDF/TXTのURLパス</label>
                <input type="text" id="new-pdf" placeholder="例: pdfs/filename.txt" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>
            <div>
                <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:4px;">作品の公式URL</label>
                <input type="text" id="new-info" placeholder="例: https://..." style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; box-sizing: border-box;">
            </div>
            
            <div style="display: flex; gap: 20px; margin: 5px 0;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" id="new-depress"> 鬱展開属性を付与
                </label>
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" id="new-favorite"> 最初からお気に入りに登録
                </label>
            </div>

            <button type="button" onclick="addNewBookLocal()" style="padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                ➕ このブラウザのリストに直接追加する
            </button>
        </form>
    </div>
</main>

</body>
</html>
